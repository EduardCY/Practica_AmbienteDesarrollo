# =============================================================================
# VIRTUALHOST APACHE2 + MOD_WSGI — MINIWEBAPP (PRÁCTICA 9 - EJERCICIO 6)
# =============================================================================
# Despliega la aplicación Flask + REST + MySQL sobre el servidor Apache2 en el
# puerto 80 utilizando el módulo estándar libapache2-mod-wsgi-py3 (PEP 3333).

<VirtualHost *:80>
    ServerName servidorWeb
    ServerAdmin eduard.criollo@uao.edu.co

    # Proceso demonio WSGI aislado con usuario sin privilegios y ruta de paquetes
    WSGIDaemonProcess miniwebapp user=vagrant group=vagrant threads=5 python-home=/usr python-path=/var/www/webapp
    WSGIProcessGroup miniwebapp
    WSGIApplicationGroup %{GLOBAL}

    # Punto de entrada WSGI hacia la instancia 'application' de Flask
    WSGIScriptAlias / /var/www/webapp/wsgi.py

    # Servir archivos estáticos directamente por Apache para máximo rendimiento
    Alias /static /var/www/webapp/web/static
    <Directory /var/www/webapp/web/static>
        Require all granted
    </Directory>

    # Permisos de acceso al directorio de la aplicación WSGI
    <Directory /var/www/webapp>
        WSGIProcessGroup miniwebapp
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    # Registros de auditoría y diagnóstico de Apache
    ErrorLog ${APACHE_LOG_DIR}/miniwebapp_error.log
    CustomLog ${APACHE_LOG_DIR}/miniwebapp_access.log combined
</VirtualHost>
