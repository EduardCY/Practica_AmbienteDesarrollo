<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniWebApp — Edit User</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 70px;
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand font-weight-bold" href="/">MiniWebApp (Flask + REST + MySQL)</a>
        <div class="navbar-nav ml-auto">
            <a class="nav-item nav-link active" href="/">Users Management</a>
            <a class="nav-item nav-link" href="/products">Products Management (Ej. 5)</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Edit User</h3>
            <a href="/" class="btn btn-secondary btn-sm">Back to Users</a>
        </div>
        <form id="edit-user-form">
            <input type="hidden" id="user-id" value="{{id}}">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Nueva contraseña o actual" required>
            </div>
            <button type="button" class="btn btn-primary btn-block" onclick="updateUser()">Save Changes</button>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="/static/script.js"></script>
<script>
    const userId = {{id}};
    fetch(`/api/users/${userId}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('user-id').value = data.id;
            document.getElementById('name').value = data.name;
            document.getElementById('email').value = data.email;
            document.getElementById('username').value = data.username;
            document.getElementById('password').value = data.password || '123';
        })
        .catch(error => console.error('Error:', error));
</script>

</body>
</html>
