<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniWebApp — Products Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 70px;
            padding-bottom: 30px;
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 550px;
            margin: 0 auto 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .table-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body onload="getProducts()">

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand font-weight-bold" href="/">MiniWebApp (Flask + REST + MySQL)</a>
        <div class="navbar-nav ml-auto">
            <a class="nav-item nav-link" href="/">Users Management</a>
            <a class="nav-item nav-link active" href="/products">Products Management (Ej. 5)</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <h3 class="mb-3">Add New Product</h3>
        <form id="add-product-form">
            <div class="form-group">
                <label for="prod-name">Product Name</label>
                <input type="text" class="form-control" id="prod-name" placeholder="Ej: Mouse Inalámbrico Pro" required>
            </div>
            <div class="form-group">
                <label for="prod-description">Description</label>
                <input type="text" class="form-control" id="prod-description" placeholder="Ej: Sensor óptico 25K DPI" required>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="prod-price">Price (USD)</label>
                    <input type="number" step="0.01" class="form-control" id="prod-price" placeholder="79.99" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="prod-stock">Stock Quantity</label>
                    <input type="number" class="form-control" id="prod-stock" placeholder="30" required>
                </div>
            </div>
            <button type="button" class="btn btn-success btn-block" onclick="createProduct()">Create Product</button>
        </form>
    </div>

    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Products Inventory List</h3>
            <button type="button" class="btn btn-info" onclick="getProducts()">Get Products</button>
        </div>
        <table id="product-list" class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
