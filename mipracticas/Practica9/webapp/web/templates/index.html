<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniWebApp — User Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 70px;
            padding-bottom: 30px;
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 550px;
            margin: 0 auto 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .table-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body onload="getUsers()">

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand font-weight-bold" href="/">MiniWebApp (Flask + REST + MySQL)</a>
        <div class="navbar-nav ml-auto">
            <a class="nav-item nav-link active" href="/">Users Management</a>
            <a class="nav-item nav-link" href="/products">Products Management (Ej. 5)</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <h3 class="mb-3">Add New User</h3>
        <form id="add-user-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" placeholder="Ej: Eduard Criollo" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Ej: eduard.criollo@uao.edu.co" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Ej: ecriollo" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="button" class="btn btn-success btn-block" onclick="createUser()">Create User</button>
        </form>
    </div>

    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Users List</h3>
            <button type="button" class="btn btn-info" onclick="getUsers()">Get Users</button>
        </div>
        <table id="user-list" class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Username</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
