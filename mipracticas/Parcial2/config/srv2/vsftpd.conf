# =============================================================================
# /etc/vsftpd.conf  -  srv2-2220335
# Practica 7 / Segundo Parcial - FTPS (TLS explicito) detras de UFW + DNAT
# =============================================================================

# --- Servicio base ------------------------------------------------------------
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Usuarios locales enjaulados en su $HOME
chroot_local_user=YES
allow_writeable_chroot=YES

# Solo usuarios listados pueden iniciar sesion FTP (vagrant queda excluido)
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# --- FTPS: TLS explicito (AUTH TLS sobre el puerto 21) ------------------------
ssl_enable=YES
allow_anon_ssl=NO
# Punto 5: cifrado obligatorio de autenticacion y de datos
force_local_logins_ssl=YES
force_local_data_ssl=YES
# Punto 5: protocolos obsoletos deshabilitados
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=YES
ssl_ciphers=HIGH
# Why NO: maximiza compatibilidad con clientes (lftp/curl) que no reutilizan la
# sesion TLS en el canal de datos. Trade-off: YES protege mejor contra el robo
# del canal de datos; FileZilla soporta YES si se desea endurecer.
require_ssl_reuse=NO
# Certificado de servidor firmado por la CA del curso
rsa_cert_file=/etc/ssl/certs/servidor.crt
rsa_private_key_file=/etc/ssl/private/servidor.key

# --- Modo pasivo coherente con UFW (Punto 6) ----------------------------------
pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50010
# IP publica de srv1: es la que se anuncia en "227 Entering Passive Mode"
pasv_address=192.168.100.3
pasv_addr_resolve=NO
# Modo activo deshabilitado: el firewall no permite conexiones salientes srv2->cliente
port_enable=NO
connect_from_port_20=NO
