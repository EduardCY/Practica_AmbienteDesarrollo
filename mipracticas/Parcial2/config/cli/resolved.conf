#  This file is part of systemd.
#
# /etc/systemd/resolved.conf  -  cli-2220335
# Practica 7 / Segundo Parcial - Parte 2: DNS sobre TLS (DoT)
#
# Formato IP#nombre: el nombre se usa para validar el certificado TLS del
# resolver (SNI + verificacion del Subject Alternative Name).
# See resolved.conf(5) for details.

[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 8.8.8.8#dns.google
FallbackDNS=9.9.9.9#dns.quad9.net 8.8.4.4#dns.google
# Why "~.": convierte a los DNS globales en ruta por defecto para TODOS los
# dominios, de modo que ningun DNS por enlace (DHCP) atienda las consultas.
Domains=~.
# yes = estricto: si TLS falla, la consulta falla (sin degradar a texto plano).
DNSOverTLS=yes
# DNSSEC no es requisito del parcial; "no" evita fallos por validacion.
DNSSEC=no
MulticastDNS=no
LLMNR=no
Cache=yes
DNSStubListener=yes
